[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-poc"
version = "0.1.0"
description = "Recorded, independently runnable static lineage and data dictionary workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2",
    "Markdown>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]
browser = ["playwright>=1.48"]

[project.scripts]
lineage-poc = "lineage_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineage_poc = ["**/*.html", "**/*.js", "**/*.css", "**/*.json", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "source_repos: requires the configured upstream source repositories",
    "browser: requires a browser or JavaScript runtime",
]
