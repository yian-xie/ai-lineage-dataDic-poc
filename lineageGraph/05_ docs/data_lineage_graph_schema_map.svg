<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1410" role="img" aria-labelledby="title description">
  <title id="title">Data Lineage Graph Structure and Schema</title>
  <desc id="description">A compact node-link diagram of the actual data lineage schema, with entity types as green circles and a complete endpoint-specific map of directed relationships.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3e4542"/>
    </marker>
    <style>
      text{font-family:Aptos,"Segoe UI",sans-serif;fill:#202724}
      .eyebrow{font-size:14px;font-weight:800;fill:#27834f}
      .title{font-size:40px;font-weight:760}
      .subtitle{font-size:16px;fill:#59645f}
      .group{font-size:13px;font-weight:800;fill:#27834f}
      .node{fill:#2d8b55;stroke:#267a4b;stroke-width:2}
      .node-text{font-size:12px;font-weight:750;fill:#fff;text-anchor:middle}
      .edge{fill:none;stroke:#3e4542;stroke-width:2.4;marker-end:url(#arrow)}
      .edge-loop{fill:none;stroke:#3e4542;stroke-width:2;marker-end:url(#arrow)}
      .label-bg{fill:#fff;fill-opacity:.96;rx:5}
      .edge-label{font-size:11px;font-weight:800;fill:#27834f;text-anchor:middle}
      .section{font-size:18px;font-weight:760}
      .list-head{font-size:12px;font-weight:800;fill:#27834f}
      .list-text{font-size:11px;fill:#27322d}
      .mono{font-family:Consolas,"Courier New",monospace;font-size:10.5px;font-weight:700;fill:#263b31}
      .fine{font-size:11px;fill:#59645f}
      .rule{stroke:#d6dfd9;stroke-width:1}
      .tag{fill:#edf6ef;stroke:#d8e9dc;stroke-width:1;rx:12}
    </style>
  </defs>
  <rect width="1900" height="1410" fill="#fff"/>
  <text class="eyebrow" x="54" y="46">DATA LINEAGE · KNOWLEDGE GRAPH SCHEMA</text>
  <text class="title" x="54" y="96">Graph Structure / Schema</text>
  <text class="subtitle" x="56" y="126">Circles show node types. The complete link map below lists every schema edge and its direction.</text>
  <rect class="tag" x="1564" y="45" width="278" height="42"/>
  <text class="eyebrow" x="1703" y="71" text-anchor="middle">SCHEMA VIEW · NOT DATA VALUES</text>

  <text class="group" x="90" y="184">SOURCE AND EXTRACT</text>
  <text class="group" x="495" y="184">HVR MOVEMENT</text>
  <text class="group" x="900" y="184">PRODUCT / AIRFLOW</text>
  <text class="group" x="1305" y="184">DBT</text>
  <text class="group" x="1640" y="184">SNOWFLAKE</text>

  <!-- Overview edges are illustrative; the complete endpoint-specific link map is below. -->
  <path class="edge" d="M250 398 C304 355 333 324 352 300"/>
  <rect class="label-bg" x="262" y="330" width="103" height="22"/><text class="edge-label" x="313" y="345">READS_FROM</text>
  <path class="edge" d="M250 462 C304 506 332 546 352 574"/>
  <rect class="label-bg" x="272" y="501" width="94" height="22"/><text class="edge-label" x="319" y="516">WRITES_TO</text>
  <path class="edge-loop" d="M155 374 C95 305 275 305 218 374"/>
  <rect class="label-bg" x="156" y="302" width="61" height="21"/><text class="edge-label" x="186" y="317">CALLS</text>

  <path class="edge" d="M479 586 C520 586 548 586 582 586"/>
  <rect class="label-bg" x="488" y="555" width="99" height="21"/><text class="edge-label" x="537" y="570">CARRIED_BY</text>
  <path class="edge" d="M646 522 C646 472 646 435 646 399"/>
  <rect class="label-bg" x="570" y="443" width="152" height="34"/><text class="edge-label" x="646" y="457">CAPTURES_FROM /</text><text class="edge-label" x="646" y="471">INTEGRATES_TO</text>
  <path class="edge" d="M700 620 C760 660 820 700 868 723"/>
  <rect class="label-bg" x="748" y="650" width="80" height="21"/><text class="edge-label" x="788" y="665">COPIES_TO</text>
  <path class="edge" d="M1138 579 C1090 633 1038 680 970 722"/>
  <rect class="label-bg" x="1000" y="626" width="174" height="46"/>
  <text class="edge-label" x="1087" y="642">COPIES_FROM</text>
  <text class="edge-label" x="1087" y="656">COPIES_TO</text>
  <text class="edge-label" x="1087" y="670">LOADS_FROM</text>

  <path class="edge" d="M1023 274 C1064 274 1090 274 1122 274"/>
  <rect class="label-bg" x="1027" y="241" width="92" height="21"/><text class="edge-label" x="1073" y="256">CONTAINS</text>
  <path class="edge" d="M1186 338 C1186 386 1186 431 1186 470"/>
  <rect class="label-bg" x="1118" y="396" width="136" height="21"/><text class="edge-label" x="1186" y="411">CONTAINS_TASK</text>
  <path class="edge-loop" d="M1140 468 C1085 407 1198 390 1230 469"/>
  <rect class="label-bg" x="1093" y="406" width="71" height="21"/><text class="edge-label" x="1128" y="421">PRECEDES</text>

  <path class="edge" d="M1250 548 C1285 552 1310 567 1350 580"/>
  <rect class="label-bg" x="1262" y="535" width="105" height="21"/><text class="edge-label" x="1314" y="550">EXECUTES_DBT</text>
  <path class="edge" d="M1414 526 C1414 492 1414 455 1414 415"/>
  <rect class="label-bg" x="1372" y="458" width="84" height="21"/><text class="edge-label" x="1414" y="473">DEPENDS_ON</text>
  <path class="edge" d="M1478 584 C1542 606 1595 632 1643 658"/>
  <rect class="label-bg" x="1518" y="603" width="112" height="21"/><text class="edge-label" x="1574" y="618">MATERIALIZES_AS</text>
  <path class="edge" d="M1478 365 C1530 432 1595 548 1650 634"/>
  <rect class="label-bg" x="1532" y="488" width="96" height="21"/><text class="edge-label" x="1580" y="503">RESOLVES_TO</text>

  <path class="edge" d="M1540 815 C1593 780 1620 746 1645 715"/>
  <rect class="label-bg" x="1549" y="757" width="71" height="21"/><text class="edge-label" x="1584" y="772">MIGRATES</text>
  <path d="M1700 754 V830" fill="none" stroke="#76827b" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text class="fine" x="1712" y="786">CANONICALIZE IDENTITY</text>
  <text class="fine" x="1712" y="801">not a lineage edge</text>

  <!-- Node circles: the 14 schema entity types. -->
  <g><circle class="node" cx="186" cy="430" r="64"/><text class="node-text" x="186" y="434">PROGRAM</text></g>
  <g><circle class="node" cx="415" cy="280" r="64"/><text class="node-text" x="415" y="284">MV_FILE</text></g>
  <g><circle class="node" cx="415" cy="600" r="64"/><text class="node-text" x="415" y="604">EXTRACT_FILE</text></g>
  <g><circle class="node" cx="646" cy="586" r="64"/><text class="node-text" x="646" y="590">HVR_CHANNEL</text></g>
  <g><circle class="node" cx="646" cy="335" r="64"/><text class="node-text" x="646" y="339">HVR_LOCATION</text></g>
  <g><circle class="node" cx="920" cy="765" r="64"/><text class="node-text" x="920" y="769">S3_PATH</text></g>
  <g><circle class="node" cx="960" cy="274" r="64"/><text class="node-text" x="960" y="278">CDP_PRODUCT</text></g>
  <g><circle class="node" cx="1186" cy="274" r="64"/><text class="node-text" x="1186" y="278">AIRFLOW_DAG</text></g>
  <g><circle class="node" cx="1186" cy="535" r="64"/><text class="node-text" x="1186" y="539">AIRFLOW_TASK</text></g>
  <g><circle class="node" cx="1414" cy="351" r="64"/><text class="node-text" x="1414" y="355">DBT_SOURCE</text></g>
  <g><circle class="node" cx="1414" cy="590" r="64"/><text class="node-text" x="1414" y="594">DBT_MODEL</text></g>
  <g><title>SNOWFLAKE_RELATION</title><circle class="node" cx="1700" cy="684" r="70"/><text class="node-text" x="1700" y="678"><tspan x="1700">SNOWFLAKE</tspan><tspan x="1700" dy="16">RELATION</tspan></text></g>
  <g><circle class="node" cx="1478" cy="850" r="70"/><text class="node-text" x="1478" y="838"><tspan x="1478">SCHEMACHANGE</tspan><tspan x="1478" dy="16">_MIGRATION</tspan></text></g>
  <g><title>SNOWFLAKE_TABLE</title><circle class="node" cx="1700" cy="900" r="70"/><text class="node-text" x="1700" y="894"><tspan x="1700">SNOWFLAKE</tspan><tspan x="1700" dy="16">TABLE</tspan></text></g>
  <rect class="tag" x="56" y="866" width="1260" height="62"/>
  <text class="fine" x="78" y="891">Node record: { id, type, properties }  ·  Edge record: { source, target, type, properties }</text>
  <text class="fine" x="78" y="914">Nodes and edges retain source_path; inferred edges also carry confidence and evidence.</text>
  <text class="fine" x="78" y="936">SNOWFLAKE_TABLE is a compatibility type; canonicalize it to the SNOWFLAKE_RELATION identity.</text>

  <path class="rule" d="M54 970 H1846"/>
  <text class="section" x="56" y="1005">Complete directed links</text>
  <text class="fine" x="270" y="1005">Each row is one source → relationship → target pattern. Repeated relationship names are separate links.</text>

  <text class="list-head" x="65" y="1040">SOURCE AND HVR</text>
  <text class="mono" x="65" y="1066">PROGRAM -READS_FROM-&gt; MV_FILE</text>
  <text class="mono" x="65" y="1089">PROGRAM -WRITES_TO-&gt; EXTRACT_FILE</text>
  <text class="mono" x="65" y="1112">PROGRAM -CALLS-&gt; PROGRAM</text>
  <text class="mono" x="65" y="1135">EXTRACT_FILE -CARRIED_BY-&gt; HVR_CHANNEL</text>
  <text class="mono" x="65" y="1158">HVR_CHANNEL -CAPTURES_FROM-&gt; HVR_LOCATION</text>
  <text class="mono" x="65" y="1181">HVR_CHANNEL -INTEGRATES_TO-&gt; HVR_LOCATION</text>
  <text class="mono" x="65" y="1204">HVR_CHANNEL -COPIES_TO-&gt; S3_PATH</text>
  <text class="mono" x="65" y="1227">HVR_CHANNEL -LANDS_IN-&gt; SNOWFLAKE_RELATION</text>

  <text class="list-head" x="660" y="1040">PRODUCT AND AIRFLOW</text>
  <text class="mono" x="660" y="1066">CDP_PRODUCT -CONTAINS-&gt; AIRFLOW_DAG</text>
  <text class="mono" x="660" y="1089">CDP_PRODUCT -CONTAINS-&gt; DBT_MODEL</text>
  <text class="mono" x="660" y="1112">CDP_PRODUCT -CONTAINS-&gt; SCHEMACHANGE_MIGRATION</text>
  <text class="mono" x="660" y="1135">AIRFLOW_DAG -CONTAINS_TASK-&gt; AIRFLOW_TASK</text>
  <text class="mono" x="660" y="1158">AIRFLOW_TASK -PRECEDES-&gt; AIRFLOW_TASK</text>
  <text class="mono" x="660" y="1181">AIRFLOW_TASK -COPIES_FROM-&gt; S3_PATH</text>
  <text class="mono" x="660" y="1204">AIRFLOW_TASK -COPIES_TO-&gt; S3_PATH</text>
  <text class="mono" x="660" y="1227">AIRFLOW_TASK -LOADS_FROM-&gt; S3_PATH</text>
  <text class="mono" x="660" y="1250">AIRFLOW_TASK -LOADS_TO-&gt; SNOWFLAKE_RELATION</text>
  <text class="mono" x="660" y="1273">AIRFLOW_TASK -EXECUTES_DBT-&gt; DBT_MODEL</text>

  <text class="list-head" x="1280" y="1040">DBT AND SCHEMACHANGE</text>
  <text class="mono" x="1280" y="1066">DBT_MODEL -DEPENDS_ON-&gt; DBT_SOURCE</text>
  <text class="mono" x="1280" y="1089">DBT_MODEL -DEPENDS_ON-&gt; DBT_MODEL</text>
  <text class="mono" x="1280" y="1112">DBT_SOURCE -RESOLVES_TO-&gt; SNOWFLAKE_RELATION</text>
  <text class="mono" x="1280" y="1135">DBT_MODEL -MATERIALIZES_AS-&gt; SNOWFLAKE_RELATION</text>
  <text class="mono" x="1280" y="1158">SCHEMACHANGE_MIGRATION -MIGRATES-&gt; SNOWFLAKE_RELATION</text>
  <text class="list-head" x="1280" y="1200">METADATA, NOT NODE TYPES</text>
  <text class="fine" x="1280" y="1225">Layers: source · extract · landing · internal · public</text>
  <text class="fine" x="1280" y="1248">Relation kind: TABLE or VIEW · every link needs evidence</text>

  <path class="rule" d="M54 1320 H1846"/>
  <text class="fine" x="56" y="1344">CDP_PRODUCT reaches S3_PATH indirectly: CDP_PRODUCT → AIRFLOW_DAG → AIRFLOW_TASK → S3_PATH; there is no direct product-to-S3 edge.</text>
  <text class="fine" x="56" y="1366">The schema defines possible links, not confirmed routes. Keep direct HVR-to-Snowflake separate from HVR-to-S3 without evidence.</text>
  <text class="fine" x="56" y="1388">Canonical definition: src/lineage/data_lineage_schema.md · nodes/edges retain source_path; inferred edges carry confidence.</text>
</svg>
